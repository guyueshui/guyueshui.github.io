{{ define "content" }}

<div
  class="search-page"
  data-search-root
  data-search-page
  data-search-index="{{ "index.json" | relURL }}?v={{ now.Unix }}"
>
  <h1 class="search-sr-only">搜索</h1>

  <form class="search-form" role="search" data-search-form>
    <label class="search-sr-only" for="search-page-input">搜索文章</label>
    <input
      id="search-page-input"
      class="search-input"
      type="search"
      name="s"
      placeholder="搜索文章…"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
      autofocus
      data-search-input
    >
  </form>

  <p class="search-status" data-search-status aria-live="polite">输入关键词开始搜索</p>
  <section class="search-results" data-search-results aria-label="搜索结果"></section>

  <noscript>
    <p class="search-status">
      搜索需要启用 JavaScript。你也可以直接浏览
      <a href="{{ "post/" | relURL }}">文章列表</a>。
    </p>
  </noscript>
</div>

{{ end }}
