<div id="mobile-navbar" class="mobile-navbar">
  <div class="mobile-navbar-icon">
    <span></span>
    <span></span>
    <span></span>
  </div>
  <div class="mobile-header-logo">
    <a href="{{ "/" | relLangURL }}" class="logo">
      {{- if .Site.Params.logoTitle -}}
        {{ .Site.Params.logoTitle }}
      {{- else -}}
        {{ .Site.Title }}
      {{- end }}
    </a>
  </div>
  <a href="{{ "search/" | relLangURL }}" class="mobile-search-toggle" data-search-open aria-label="搜索" title="搜索" aria-haspopup="dialog" aria-controls="search-overlay" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <circle cx="11" cy="11" r="7"></circle>
      <path d="m20 20-3.5-3.5"></path>
    </svg>
  </a>
</div>
<nav id="mobile-menu" class="mobile-menu slideout-menu">
  <ul class="mobile-menu-list">
    {{ range .Site.Menus.main -}}
      {{- if eq .Identifier "search" -}}
        <a href="{{ .URL | safeURL }}" class="mobile-menu-search-link" data-search-open aria-label="搜索" title="搜索" aria-haspopup="dialog" aria-controls="search-overlay" aria-expanded="false">
          <li class="mobile-menu-item mobile-menu-item-search">
            <svg class="mobile-menu-search-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="m20 20-3.5-3.5"></path>
            </svg>
          </li>
        </a>
      {{- else -}}
        <a href="{{ .URL | safeURL }}">
          <li class="mobile-menu-item">{{ .Name }}</li>
        </a>
      {{- end -}}
    {{- end }}
  </ul>

  {{ partial "header/language-selector.html" . }}
</nav>
