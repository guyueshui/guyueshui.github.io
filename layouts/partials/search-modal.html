<div
  id="search-overlay"
  class="search-overlay"
  data-search-root
  data-search-index="{{ "index.json" | relURL }}?v={{ now.Unix }}"
  hidden
>
  <div class="search-dialog" role="dialog" aria-modal="true" aria-labelledby="search-dialog-title">
    <div class="search-dialog-header">
      <h2 id="search-dialog-title" class="search-dialog-title">搜索</h2>
      <button type="button" class="search-close" data-search-close aria-label="关闭搜索">×</button>
    </div>

    <form class="search-form" role="search" data-search-form>
      <label class="search-sr-only" for="search-modal-input">搜索文章</label>
      <input
        id="search-modal-input"
        class="search-input"
        type="search"
        name="s"
        placeholder="搜索文章…"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        data-search-input
      >
      <kbd class="search-kbd">Esc</kbd>
    </form>

    <p class="search-status" data-search-status aria-live="polite">输入关键词开始搜索</p>
    <section class="search-results" data-search-results aria-label="搜索结果"></section>

    <p class="search-hint">
      <kbd>Ctrl</kbd> / <kbd>⌘</kbd> + <kbd>K</kbd> 打开搜索 · <kbd>Esc</kbd> 关闭
    </p>
  </div>
</div>
